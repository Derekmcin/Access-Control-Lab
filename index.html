<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Access Control Lab — Student edition</title>
<style>
:root {
  --ink: #1c1915;
  --paper: #f4f0e6;
  --card: #fffdf8;
  --green: #1c3d34;
  --green-2: #2f6a56;
  --gold: #c6a15b;
  --brass: #a67c45;
  --bad: #8d1d18;
  --ok: #1e6b3a;
  --warn: #8a5a10;
  --line: #d9d0c1;
  --shadow: 0 8px 24px rgba(40, 30, 15, .12);
  font-family: Calibri, Carlito, Candara, "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
body { font-size: 17px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #0b6b4f; outline-offset: 2px; }
.top {
  background: var(--green);
  color: #f6f1e6;
  padding: 14px 22px 12px;
  border-bottom: 5px solid var(--gold);
}
.top h1 { margin: 0; font-size: 28px; letter-spacing: .02em; font-weight: 700; }
.top p { margin: 4px 0 0; color: #e4dcc8; font-size: 15px; }
.top .row { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: end; }
.who { text-align: right; font-size: 14px; color: #f0e6cf; }
.who strong { color: white; }
.layout { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 92px); }
.nav { background: #efe8da; border-right: 1px solid var(--line); padding: 12px; }
.nav button {
  display: block; width: 100%; text-align: left; margin: 0 0 6px; padding: 8px 10px;
  background: transparent; border: 1px solid transparent; border-radius: 8px;
}
.nav button.on { background: white; border-color: var(--gold); font-weight: 700; }
.nav button small { display: block; color: #5c564c; font-weight: 400; }
.nav .pip { float: right; font-size: 12px; background: var(--green); color: white; border-radius: 99px; padding: 1px 7px; }
.nav .pip.wait { background: #c4b8a4; }
main { padding: 16px 18px 40px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px; }
.grid-missions { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.mission-card { text-align: left; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); }
.mission-card strong { display: block; font-size: 16px; }
.mission-card span { color: #5c564c; font-size: 14px; }
.kicker { color: var(--green-2); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; }
h2 { margin: 0 0 8px; font-size: 26px; line-height: 1.2; }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; align-items: start; }
.toolbar, .tray { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.toolbar button, .tray button, .btn {
  background: white; border: 1px solid #c9bfae; border-radius: 8px; padding: 6px 10px;
}
.btn.primary, button.primary { background: var(--green); color: white; border-color: var(--green); }
.btn.bad, button.bad { background: var(--bad); color: white; border-color: var(--bad); }
.btn.gold, button.gold { background: #f3e2bc; border-color: var(--gold); }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #333; padding: 0; }
.swatch.on { outline: 3px solid var(--green); }
.board-wrap { overflow: auto; max-width: 100%; border-radius: 12px; }
.board {
  position: relative; min-height: 760px; min-width: 980px;
  background-color: #d7b57a;
  background-image:
    repeating-linear-gradient(90deg, rgba(80, 45, 15, .05) 0 2px, transparent 2px 11px),
    linear-gradient(#e7cb93, #c79a55);
  box-shadow: inset 0 0 0 10px #8a6438, inset 0 0 50px rgba(70, 40, 10, .25);
}
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.wires path.hit { pointer-events: stroke; cursor: pointer; fill: none; stroke: transparent; stroke-width: 14; }
.wires path.vis { fill: none; stroke-width: 3.5; stroke-linecap: round; }
.wires path.vis.sel { stroke-width: 6; }
.wires text { font-size: 11px; fill: #1c1915; font-family: Calibri, Carlito, sans-serif; }
.dev {
  position: absolute; width: 200px; background: #f7f3ea; border: 1px solid #6d6458;
  border-radius: 10px; box-shadow: 2px 3px 0 rgba(40, 30, 15, .25); z-index: 2;
}
.dev.sel { outline: 3px solid #0b6b4f; }
.dev header {
  background: #2a2a28; color: #f4efe4; border-radius: 9px 9px 0 0; padding: 6px 8px; cursor: grab; font-size: 14px;
}
.dev header small { display: block; color: #c9bfae; font-weight: 400; }
.dev .body { padding: 8px; font-size: 13px; }
.terms { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px 8px; }
.term {
  background: radial-gradient(circle at 40% 35%, #f0d7a4, var(--brass));
  border: 1px solid #5c431c; border-radius: 6px; padding: 3px 6px; font-size: 12px; font-weight: 700;
}
.term.hot { outline: 3px solid #c2410c; }
.term.probe-red { box-shadow: 0 0 0 3px #c62828; }
.term.probe-black { box-shadow: 0 0 0 3px #111; }
.face { display: flex; gap: 8px; align-items: center; min-height: 36px; }
.lamp { width: 18px; height: 18px; border-radius: 50%; background: #444; box-shadow: inset 0 0 0 2px #222; }
.lamp.on { background: #d32f2f; box-shadow: 0 0 10px #ff8a80; }
.lamp.green.on { background: #2e7d32; box-shadow: 0 0 10px #a5d6a7; }
.led-dot { width: 16px; height: 16px; border-radius: 50%; background: #5d4037; }
.led-dot.on { background: #ffeb3b; box-shadow: 0 0 12px #fff176; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; background: #eee; }
.pill.bad { background: #f8d0cc; color: var(--bad); }
.pill.ok { background: #d9f0e0; color: var(--ok); }
.pill.warn { background: #fff1d6; color: var(--warn); }
.aside { position: sticky; top: 8px; }
.aside h3 { margin: 0 0 6px; font-size: 16px; }
.tabs { display: flex; gap: 4px; margin-bottom: 8px; }
.tabs button { border: 1px solid var(--line); background: #f7f3ea; border-radius: 8px 8px 0 0; padding: 6px 8px; }
.tabs button.on { background: white; border-bottom-color: white; font-weight: 700; }
.prose p { margin: 0 0 8px; }
.prose li { margin: 0 0 4px; }
.q { margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.q label { display: block; margin: 4px 0; }
.msg { padding: 8px 10px; border-radius: 8px; margin: 6px 0; background: #f7f1e4; }
.msg.bad, .msg.crit { background: #fde8e6; border: 1px solid #e7b2ad; }
.msg.warn { background: #fff6e0; border: 1px solid #efd7a4; }
.msg.ok { background: #e5f6ea; border: 1px solid #b7e0c2; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { border-bottom: 1px solid var(--line); text-align: left; padding: 6px 8px; vertical-align: top; }
.hero-door {
  display: flex; gap: 16px; align-items: center; background: #241f1b; color: #f6f1e6;
  border-radius: 12px; padding: 10px 14px; margin-bottom: 8px;
}
.door-svg { width: 74px; height: 90px; }
.hero-door strong { font-size: 22px; letter-spacing: .04em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px dashed #8d8376; background: #fff; border-radius: 8px; padding: 6px 8px; text-align: left; max-width: 280px; }
.chip.on { border-style: solid; border-color: var(--green); background: #e7f3ee; }
.id-card { min-height: 92px; background: white; border: 1px dashed #b5ab9d; border-radius: 10px; padding: 8px; }
.id-card.filled { border-style: solid; border-color: var(--green-2); }
.log { max-height: 220px; overflow: auto; background: #1d1c1a; color: #e8ffe8; font-family: Consolas, "Courier New", monospace; font-size: 13px; padding: 8px; border-radius: 8px; }
.chain { background: white; border-radius: 10px; padding: 8px; }
.meter-read { font-weight: 700; min-width: 180px; }
footer.site { padding: 12px 18px 24px; color: #5c564c; font-size: 14px; }
#print-sheet { display: none; }
@media (max-width: 1100px) {
  .layout { grid-template-columns: 1fr; }
  .nav { display: flex; gap: 6px; overflow: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav button { width: auto; white-space: nowrap; }
  .work { grid-template-columns: 1fr; }
  .aside { position: static; }
  .who { text-align: left; }
}
@media print {
  .top, .nav, .no-print, footer.site { display: none !important; }
  #print-sheet { display: block !important; }
  body { background: white; }
  .layout { display: block; }
  main { padding: 0; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* The Access Control Lab — circuit engine.
   Offline, manufacturer-neutral model of the J7X2 33 practical circuits.
   DC net solver: wires and closed contacts are ideal joins; coils, LEDs and
   PSU sources are stamped into a modified nodal matrix. Relay coils, keypad
   and controller lock relays, diodes and the audio lock output iterate to a
   consistent state. */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.ACLEngine = factory();
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  var FUSE_A = 2;
  var LOCK_MIN_V = 9.5;
  var RELAY_MIN_V = 8;
  var POWER_MIN_V = 9;
  var LED_MIN_V = 1.8;
  var DIODE_ON_V = 0.55;

  var TERMS = {
    psu: ["p12", "v0"],
    sw: ["c", "l1"],
    pte: ["com", "no", "nc"],
    edru: ["c", "nc", "no"],
    edru2: ["c1", "nc1", "no1", "c2", "nc2", "no2"],
    relay: ["a1", "a2", "com", "no", "nc"],
    strikeFS: ["p", "n"],
    strikeFU: ["p", "n"],
    mag: ["p", "n"],
    led: ["a", "k"],
    diode: ["a", "k"],
    keypad: ["p12", "v0", "com", "no", "nc", "rex", "rex0"],
    reader: ["d0", "d1", "v0", "scr"],
    ctrl: ["p12", "v0", "d0", "d1", "rv0", "scr", "rex", "rex0", "dc", "dc0", "lkc", "lknc", "lkno"],
    door: ["a", "b"],
    fire: ["in", "out"],
    panel: ["p12", "v0", "r", "t", "i", "h"],
    handset: ["i", "r", "o", "t", "z"],
    reel: ["a1", "b1", "a2", "b2"],
    jb: ["j1", "j2", "j3", "j4"]
  };

  var CATALOGUE = {
    psu: { name: "Elmdene 12 V PSU", blurb: "Boxed 12 V dc supply. On charge the output is about 13.6–13.8 V. Battery space and a fuse in the positive, close to the battery." },
    sw: { name: "1-way switch", blurb: "Plate switch. C is common, L1 is the switched leg." },
    pte: { name: "Exit button (PTE)", blurb: "Push to exit, COM / NO / NC. A convenience device — not an emergency release. Hoyles and similar buttons use the same contacts." },
    edru: { name: "Hoyles / STI EDRU", blurb: "Green emergency door release, single pole. Set: C–NC closed. Operated: C–NC opens." },
    edru2: { name: "Hoyles double-pole EDRU", blurb: "Green double-pole unit. Breaks both legs. The second pole can signal an alarm." },
    relay: { name: "12 V interface relay", blurb: "DIN relay. Coil A1 A2. Contacts COM, NO, NC. NO closes when the coil is energised." },
    strikeFS: { name: "Adams Rite fail-secure strike", blurb: "12 V dc electric strike, power to release. Stays locked if the supply is lost. Assa Abloy and Adams Rite strikes are the usual workshop pattern." },
    strikeFU: { name: "Fail-safe electric strike", blurb: "12 V dc, power to lock. Releases if the supply is lost. Many Adams Rite strikes are field-reversible — set the mode from the data sheet." },
    mag: { name: "CDVI / Securitron maglock", blurb: "12 V dc surface maglock. Power to lock, so it is always fail-safe. GEM and Securitron units are the same idea. Read the label for the current." },
    led: { name: "LED indicator", blurb: "12 V LED with series resistor. Anode A, cathode K. Polarity matters." },
    diode: { name: "1N4001 diode", blurb: "Suppression diode. Paxton fit one across the lock. The band is the cathode and goes to the positive side of the coil." },
    keypad: { name: "Stand-alone keypad", blurb: "CDVI, Videx or Paxton stand-alone keypad. Supply, lock relay COM / NO / NC, and an exit input. Change the factory code before handover." },
    reader: { name: "Paxton proximity reader", blurb: "Reader port: Data/D0, Clock/D1, 0 V and screen. A real Net2 reader port also has 12 V, LED and Media Detect." },
    ctrl: { name: "Paxton Net2 plus", blurb: "Single-door ACU. Voltage-free Relay 1 (COM, NO, NC). Exit is push-to-make. Door contact is held closed by the door." },
    door: { name: "Door contact", blurb: "Reed switch. Closed while the door is shut. On Net2 this lands on Contact and 0 V." },
    fire: { name: "Fire-alarm interface relay", blurb: "Contact held closed by the fire system. Opens on a fire signal or if the hold is lost. This is the fail-safe release, not a software command." },
    panel: { name: "Bell 61 speech unit", blurb: "One-way audio speech unit for a Bell System entrance. Supply, I R O T to the 801 phone, and H as the 12 V lock feed." },
    handset: { name: "Bell 801 handset", blurb: "I call, R microphone, O common, T speaker, Z lock button. Z shorts to O when the lock button is pressed." },
    reel: { name: "Cat5e cable reel", blurb: "For the volt-drop test. One core each way, or two cores in parallel." },
    jb: { name: "Terminal block", blurb: "Four isolated ways. Land extra cores on a way to join them." }
  };

  function defaultState(type) {
    if (type === "sw") return { on: false };
    if (type === "pte") return { pressed: false };
    if (type === "edru" || type === "edru2") return { operated: false };
    if (type === "door") return { open: false };
    if (type === "fire") return { alarm: false };
    if (type === "panel") return { call: false };
    if (type === "handset") return { release: false };
    if (type === "reel") return { len: "short" };
    if (type === "psu") return { output: false, mains: true, battery: false, vset: 13.6 };
    return {};
  }

  function createWorld() {
    return { components: [], wires: [], fuseBlown: false, nextId: 1, nextWire: 1, nextPair: 1 };
  }

  function addComponent(world, type, x, y, state) {
    if (!TERMS[type]) throw new Error("Unknown part " + type);
    var id = type + world.nextId++;
    var st = defaultState(type);
    if (state) {
      Object.keys(state).forEach(function (k) { st[k] = state[k]; });
    }
    var c = { id: id, type: type, x: x || 40, y: y || 40, state: st };
    world.components.push(c);
    return c;
  }

  function addWire(world, a, b, colour, cable, pairId) {
    if (a === b) return null;
    var w = {
      id: "w" + world.nextWire++,
      a: a, b: b,
      colour: colour || "red",
      cable: cable || "4core",
      pairId: pairId || null
    };
    world.wires.push(w);
    return w;
  }

  function removeWire(world, id) {
    world.wires = world.wires.filter(function (w) { return w.id !== id; });
  }

  function removeComponent(world, id) {
    world.components = world.components.filter(function (c) { return c.id !== id; });
    world.wires = world.wires.filter(function (w) {
      return w.a.indexOf(id + ".") !== 0 && w.b.indexOf(id + ".") !== 0;
    });
  }

  function cloneWorld(world) {
    return JSON.parse(JSON.stringify(world));
  }

  function keyOf(id, term) { return id + "." + term; }

  function makeUF(keys) {
    var p = {};
    keys.forEach(function (k) { p[k] = k; });
    function find(k) {
      if (p[k] !== k) p[k] = find(p[k]);
      return p[k];
    }
    function union(a, b) {
      if (p[a] === undefined || p[b] === undefined) return;
      a = find(a); b = find(b);
      if (a !== b) p[b] = a;
    }
    return { find: find, union: union };
  }

  function allTermKeys(world) {
    var keys = [];
    world.components.forEach(function (c) {
      TERMS[c.type].forEach(function (t) { keys.push(keyOf(c.id, t)); });
    });
    return keys;
  }

  function solveLinear(A, b) {
    var n = b.length;
    var M = [];
    for (var i = 0; i < n; i++) {
      var row = A[i].slice();
      row.push(b[i]);
      M.push(row);
    }
    for (var col = 0; col < n; col++) {
      var piv = col;
      for (var r = col + 1; r < n; r++) {
        if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
      }
      if (Math.abs(M[piv][col]) < 1e-12) return null;
      var tmp = M[col]; M[col] = M[piv]; M[piv] = tmp;
      var div = M[col][col];
      for (var c = col; c <= n; c++) M[col][c] /= div;
      for (var r2 = 0; r2 < n; r2++) {
        if (r2 === col) continue;
        var f = M[r2][col];
        if (f === 0) continue;
        for (var c2 = col; c2 <= n; c2++) M[r2][c2] -= f * M[col][c2];
      }
    }
    var x = [];
    for (var i2 = 0; i2 < n; i2++) x.push(M[i2][n]);
    return x;
  }

  function emptyFlags() {
    return { relayOn: {}, keypadOn: {}, ctrlOn: {}, diodeOn: {}, ledOn: {}, audioLock: {}, fuseBlown: false };
  }

  function flagsKey(flags) {
    return JSON.stringify(flags);
  }

  function mechanicalUnions(world, uf) {
    world.components.forEach(function (c) {
      var k = function (t) { return keyOf(c.id, t); };
      var s = c.state || {};
      if (c.type === "sw" && s.on) uf.union(k("c"), k("l1"));
      if (c.type === "pte") {
        if (s.pressed) uf.union(k("com"), k("no"));
        else uf.union(k("com"), k("nc"));
      }
      if (c.type === "edru") {
        if (s.operated) uf.union(k("c"), k("no"));
        else uf.union(k("c"), k("nc"));
      }
      if (c.type === "edru2") {
        if (s.operated) {
          uf.union(k("c1"), k("no1"));
          uf.union(k("c2"), k("no2"));
        } else {
          uf.union(k("c1"), k("nc1"));
          uf.union(k("c2"), k("nc2"));
        }
      }
      if (c.type === "door" && !s.open) uf.union(k("a"), k("b"));
      if (c.type === "fire" && !s.alarm) uf.union(k("in"), k("out"));
      if (c.type === "panel") uf.union(k("h"), k("p12"));
      if (c.type === "handset" && s.release) uf.union(k("z"), k("o"));
    });
  }

  function flaggedUnions(world, uf, flags) {
    world.components.forEach(function (c) {
      var k = function (t) { return keyOf(c.id, t); };
      if (c.type === "relay") {
        if (flags.relayOn[c.id]) uf.union(k("com"), k("no"));
        else uf.union(k("com"), k("nc"));
      }
      if (c.type === "keypad") {
        if (flags.keypadOn[c.id]) uf.union(k("com"), k("no"));
        else uf.union(k("com"), k("nc"));
      }
      if (c.type === "ctrl") {
        if (flags.ctrlOn[c.id]) uf.union(k("lkc"), k("lkno"));
        else uf.union(k("lkc"), k("lknc"));
      }
});
  }

  function resistorList(world, flags) {
    var list = [];
    world.components.forEach(function (c) {
      var k = function (t) { return keyOf(c.id, t); };
      if (c.type === "strikeFS" || c.type === "strikeFU") list.push([k("p"), k("n"), 24]);
      if (c.type === "mag") list.push([k("p"), k("n"), 48]);
      if (c.type === "relay") list.push([k("a1"), k("a2"), 400]);
      if (c.type === "keypad") list.push([k("p12"), k("v0"), 120]);
      if (c.type === "ctrl") list.push([k("p12"), k("v0"), 68]);
      if (c.type === "panel") list.push([k("p12"), k("v0"), 220]);
      if (c.type === "reader") list.push([k("d0"), k("v0"), 400]);
      if (c.type === "diode" && flags.diodeOn[c.id]) list.push([k("a"), k("k"), 0.8]);
      if (c.type === "led" && flags.ledOn[c.id]) list.push([k("a"), k("k"), 680]);
      if (c.type === "reel") {
        var each = c.state.len === "50" ? 4.7 : c.state.len === "50p" ? 2.35 : 0.15;
        list.push([k("a1"), k("a2"), each]);
        list.push([k("b1"), k("b2"), each]);
      }
    });
    return list;
  }

  function solveOnce(world, flags) {
    var keys = allTermKeys(world);
    if (!keys.length) {
      return { v: {}, current: 0, shorted: false, singular: false, same: function () { return false; } };
    }
    var uf = makeUF(keys);
    world.wires.forEach(function (w) { uf.union(w.a, w.b); });
    mechanicalUnions(world, uf);
    flaggedUnions(world, uf, flags);

    var roots = [];
    var rootIndex = {};
    keys.forEach(function (k) {
      var r = uf.find(k);
      if (rootIndex[r] === undefined) {
        rootIndex[r] = roots.length;
        roots.push(r);
      }
    });

    var psu = null;
    for (var pi = 0; pi < world.components.length; pi++) {
      if (world.components[pi].type === "psu") { psu = world.components[pi]; break; }
    }
    var gnd = 0;
    if (psu) gnd = rootIndex[uf.find(keyOf(psu.id, "v0"))];

    var sources = [];
    if (psu && !flags.fuseBlown) {
      var volts = sourceVolts(psu);
      if (volts > 0) {
        var pNode = rootIndex[uf.find(keyOf(psu.id, "p12"))];
        var nNode = rootIndex[uf.find(keyOf(psu.id, "v0"))];
        if (pNode === nNode) {
          return { v: zeroV(keys), current: 99, shorted: true, singular: false, same: function (a, b) { return uf.find(a) === uf.find(b); } };
        }
        sources.push({ pNode: pNode, nNode: nNode, volts: volts });
      }
    }

    var idx = {};
    var nUnknown = 0;
    for (var i = 0; i < roots.length; i++) {
      if (i !== gnd) idx[i] = nUnknown++;
    }
    var N = nUnknown + sources.length;
    if (N === 0) {
      return { v: zeroV(keys), current: 0, shorted: false, singular: false, same: function (a, b) { return uf.find(a) === uf.find(b); } };
    }

    var A = [];
    var b = [];
    for (var r = 0; r < N; r++) {
      var row = [];
      for (var c = 0; c < N; c++) row.push(0);
      A.push(row);
      b.push(0);
    }

    function stampR(n1, n2, ohms) {
      if (n1 === n2) return;
      var g = 1 / ohms;
      var rows = [];
      if (n1 !== gnd) rows.push([idx[n1], 1]);
      if (n2 !== gnd) rows.push([idx[n2], -1]);
      for (var i1 = 0; i1 < rows.length; i1++) {
        for (var j1 = 0; j1 < rows.length; j1++) {
          A[rows[i1][0]][rows[j1][0]] += g * rows[i1][1] * rows[j1][1];
        }
      }
    }

    for (var ni = 0; ni < roots.length; ni++) {
      if (ni !== gnd) A[idx[ni]][idx[ni]] += 1e-6;
    }

    resistorList(world, flags).forEach(function (res) {
      var n1 = rootIndex[uf.find(res[0])];
      var n2 = rootIndex[uf.find(res[1])];
      stampR(n1, n2, res[2]);
    });

    sources.forEach(function (s, si) {
      var iVar = nUnknown + si;
      if (s.pNode !== gnd) A[idx[s.pNode]][iVar] += -1;
      if (s.nNode !== gnd) A[idx[s.nNode]][iVar] += 1;
      if (s.pNode !== gnd) A[iVar][idx[s.pNode]] += 1;
      if (s.nNode !== gnd) A[iVar][idx[s.nNode]] += -1;
      b[iVar] = s.volts;
    });

    var x = solveLinear(A, b);
    if (!x) {
      return { v: zeroV(keys), current: 0, shorted: false, singular: true, same: function (a, b2) { return uf.find(a) === uf.find(b2); } };
    }
    var vNode = [];
    for (var n = 0; n < roots.length; n++) vNode.push(0);
    for (var n2 = 0; n2 < roots.length; n2++) {
      if (n2 !== gnd) vNode[n2] = x[idx[n2]];
    }
    var v = {};
    keys.forEach(function (k) { v[k] = vNode[rootIndex[uf.find(k)]]; });
    var current = sources.length ? x[nUnknown] : 0;
    if (current < 0 && current > -0.05) current = 0;
    return {
      v: v,
      current: current,
      shorted: false,
      singular: false,
      same: function (a, b2) { return uf.find(a) === uf.find(b2); }
    };
  }

  function sourceVolts(psu) {
    var s = psu.state || {};
    if (!s.output) return 0;
    if (s.mains) return s.vset || 13.6;
    if (s.battery) return Math.min(s.vset || 13.6, 12.2);
    return 0;
  }

  function zeroV(keys) {
    var v = {};
    keys.forEach(function (k) { v[k] = 0; });
    return v;
  }

  function volt(result, id, term) {
    var val = result.v[keyOf(id, term)];
    return typeof val === "number" ? val : 0;
  }

  function deriveFlags(world, sim, result, prev) {
    var next = {
      relayOn: {}, keypadOn: {}, ctrlOn: {}, diodeOn: {}, ledOn: {}, audioLock: {},
      fuseBlown: prev.fuseBlown
    };
    var now = sim && sim.now ? sim.now : 0;
    world.components.forEach(function (c) {
      if (c.type === "relay") {
        next.relayOn[c.id] = volt(result, c.id, "a1") - volt(result, c.id, "a2") >= RELAY_MIN_V;
      }
      if (c.type === "diode") {
        next.diodeOn[c.id] = volt(result, c.id, "a") - volt(result, c.id, "k") >= DIODE_ON_V;
      }
      if (c.type === "led") {
        next.ledOn[c.id] = volt(result, c.id, "a") - volt(result, c.id, "k") >= LED_MIN_V;
      }
      if (c.type === "keypad") {
        var kp = volt(result, c.id, "p12") - volt(result, c.id, "v0") >= POWER_MIN_V;
        var rex = result.same(keyOf(c.id, "rex"), keyOf(c.id, "rex0"));
        var timer = sim && sim.keypadUntil && now < sim.keypadUntil;
        next.keypadOn[c.id] = !!(kp && (rex || timer));
      }
      if (c.type === "ctrl") {
        var cp = volt(result, c.id, "p12") - volt(result, c.id, "v0") >= POWER_MIN_V;
        var crex = result.same(keyOf(c.id, "rex"), keyOf(c.id, "rex0"));
        var grant = sim && sim.grantUntil && now < sim.grantUntil;
        next.ctrlOn[c.id] = !!(cp && (crex || grant));
      }
    });
    return next;
  }

  function speechPath(result, panel, hs) {
    if (!panel || !hs || !result) return false;
    var pp = volt(result, panel.id, "p12") - volt(result, panel.id, "v0");
    if (pp < POWER_MIN_V) return false;
    return result.same(keyOf(panel.id, "r"), keyOf(hs.id, "r")) &&
      result.same(keyOf(panel.id, "t"), keyOf(hs.id, "t")) &&
      result.same(keyOf(panel.id, "v0"), keyOf(hs.id, "o"));
  }

  function evaluate(world, sim, opts) {
    sim = sim || { now: 0 };
    opts = opts || {};
    var flags = emptyFlags();
    flags.fuseBlown = !!world.fuseBlown;
    var result = null;
    var unstable = false;
    var blew = false;
    var shorted = false;
    var peak = 0;
    var guard = 0;
    while (guard < 16) {
      guard++;
      result = solveOnce(world, flags);
      peak = Math.max(peak, result.current || 0);
      if (result.shorted || (result.current || 0) > FUSE_A) {
        blew = true;
        shorted = !!result.shorted || (result.current || 0) > 20;
        flags.fuseBlown = true;
        result = solveOnce(world, flags);
        break;
      }
      var next = deriveFlags(world, sim, result, flags);
      if (flagsKey(next) === flagsKey(flags)) break;
      flags = next;
      if (guard === 16) unstable = true;
    }
    if (opts.commit && blew) world.fuseBlown = true;

    var devices = {};
    world.components.forEach(function (c) {
      devices[c.id] = deviceReport(c, result, flags, sim);
    });
    var suppression = {};
    world.components.forEach(function (c) {
      if (c.type === "strikeFS" || c.type === "strikeFU" || c.type === "mag" || c.type === "relay") {
        var pos = (c.type === "relay") ? "a1" : "p";
        var neg = (c.type === "relay") ? "a2" : "n";
        suppression[c.id] = diodeAcross(world, keyOf(c.id, pos), keyOf(c.id, neg));
      }
    });

    return {
      fuseBlown: !!flags.fuseBlown || blew,
      justBlew: blew && !world.fuseBlown,
      shorted: shorted || !!(result && result.shorted),
      singular: !!(result && result.singular),
      unstable: unstable,
      current: flags.fuseBlown || blew ? 0 : (result ? result.current : 0),
      peakCurrent: peak,
      v: result ? result.v : {},
      same: result ? result.same : function () { return false; },
      flags: flags,
      devices: devices,
      suppression: suppression,
      speech: speechReport(world, result),
      messages: diagnose(world, sim, result, flags, devices, suppression, blew, unstable)
    };
  }

  function speechReport(world, result) {
    var panel = world.components.filter(function (c) { return c.type === "panel"; })[0];
    var hs = world.components.filter(function (c) { return c.type === "handset"; })[0];
    if (!panel || !hs || !result) return { speech: false, ringing: false };
    var ok = speechPath(result, panel, hs);
    var iLinked = result.same(keyOf(panel.id, "i"), keyOf(hs.id, "i"));
    return { speech: ok, ringing: !!(ok && panel.state.call && iLinked) };
  }

  function deviceReport(c, result, flags, sim) {
    var d = { id: c.id, type: c.type, name: CATALOGUE[c.type].name };
    function dv(t) { return volt(result, c.id, t); }
    if (c.type === "psu") {
      d.volts = dv("p12") - dv("v0");
      d.output = !!(c.state && c.state.output);
      d.onBattery = !!(c.state && c.state.output && !c.state.mains && c.state.battery);
    }
    if (c.type === "strikeFS" || c.type === "strikeFU" || c.type === "mag") {
      var signed = dv("p") - dv("n");
      d.volts = signed;
      d.polarityOk = signed >= -0.2;
      d.reversed = signed < -1;
      d.energised = signed >= LOCK_MIN_V;
      if (c.type === "strikeFS") {
        d.released = d.energised;
        d.locked = !d.energised;
      } else {
        d.locked = d.energised;
        d.released = !d.energised;
      }
      d.holding = d.locked && d.energised;
    }
    if (c.type === "led") {
      var lv = dv("a") - dv("k");
      d.volts = lv;
      d.ledOn = !!flags.ledOn[c.id] && lv >= LED_MIN_V;
      d.reversed = lv < -1;
    }
    if (c.type === "relay") {
      d.coilV = dv("a1") - dv("a2");
      d.relayOn = !!flags.relayOn[c.id];
      d.reversed = d.coilV < -1;
    }
    if (c.type === "keypad") {
      d.powered = dv("p12") - dv("v0") >= POWER_MIN_V;
      d.relayOn = !!flags.keypadOn[c.id];
      d.rex = result.same(keyOf(c.id, "rex"), keyOf(c.id, "rex0"));
    }
    if (c.type === "ctrl") {
      d.powered = dv("p12") - dv("v0") >= POWER_MIN_V;
      d.relayOn = !!flags.ctrlOn[c.id];
      d.rex = result.same(keyOf(c.id, "rex"), keyOf(c.id, "rex0"));
      d.doorShut = result.same(keyOf(c.id, "dc"), keyOf(c.id, "dc0"));
    }
    if (c.type === "diode") {
      d.forward = !!flags.diodeOn[c.id];
      d.volts = dv("a") - dv("k");
    }
    if (c.type === "fire") d.alarm = !!(c.state && c.state.alarm);
    if (c.type === "edru" || c.type === "edru2") d.operated = !!(c.state && c.state.operated);
    if (c.type === "sw") d.on = !!(c.state && c.state.on);
    if (c.type === "pte") d.pressed = !!(c.state && c.state.pressed);
    return d;
  }

  function readerLinked(world, result) {
    var ctrl = world.components.filter(function (c) { return c.type === "ctrl"; })[0];
    var reader = world.components.filter(function (c) { return c.type === "reader"; })[0];
    if (!ctrl || !reader || !result) return false;
    return result.same(keyOf(ctrl.id, "d0"), keyOf(reader.id, "d0")) &&
      result.same(keyOf(ctrl.id, "d1"), keyOf(reader.id, "d1")) &&
      result.same(keyOf(ctrl.id, "rv0"), keyOf(reader.id, "v0"));
  }

  function wireOnlyAcross(world, posKey, negKey) {
    var keys = allTermKeys(world);
    var uf = makeUF(keys);
    world.wires.forEach(function (w) { uf.union(w.a, w.b); });
    var status = "missing";
    world.components.forEach(function (c) {
      if (c.type !== "diode") return;
      var a = uf.find(keyOf(c.id, "a"));
      var k = uf.find(keyOf(c.id, "k"));
      if (k === uf.find(posKey) && a === uf.find(negKey)) status = "correct";
      else if (status !== "correct" && a === uf.find(posKey) && k === uf.find(negKey)) status = "reversed";
    });
    return status;
  }

  function diodeAcross(world, posKey, negKey) {
    return wireOnlyAcross(world, posKey, negKey);
  }

  function isWired(world, id) {
    return world.wires.some(function (w) {
      return w.a.indexOf(id + ".") === 0 || w.b.indexOf(id + ".") === 0;
    });
  }

  function diagnose(world, sim, result, flags, devices, suppression, blew, unstable) {
    var msgs = [];
    if (blew || flags.fuseBlown) {
      msgs.push({ level: "bad", text: "Fuse open. Current exceeded 2 A, or +12 V is shorted to 0 V. A diode with the band towards negative will do this as soon as the coil is switched on. Find the short before you replace the fuse." });
    }
    if (unstable) msgs.push({ level: "bad", text: "The relay circuit is not settling. Check that a contact is not fighting its own coil." });
    Object.keys(devices).forEach(function (id) {
      var d = devices[id];
      if ((d.type === "strikeFS" || d.type === "strikeFU" || d.type === "mag") && isWired(world, id)) {
        if (d.reversed) msgs.push({ level: "bad", text: d.name + " has reversed polarity. It will not operate. + must be positive of −." });
        else if (d.volts > 1 && d.volts < LOCK_MIN_V) msgs.push({ level: "warn", text: d.name + " is only seeing " + d.volts.toFixed(1) + " V. Below about " + LOCK_MIN_V + " V a 12 V lock is unreliable — check volt drop and core size." });
      }
      if (d.type === "led" && d.reversed) msgs.push({ level: "warn", text: "LED is reverse-biased and staying dark. Anode to positive, cathode (flat / short lead) to negative." });
      if (d.type === "relay" && d.reversed) msgs.push({ level: "warn", text: "Relay coil polarity is reversed (A1 should be positive). This coil has not pulled in." });
      var sup = suppression[id];
      if (sup === "reversed" && !flags.fuseBlown) {
        msgs.push({ level: "bad", text: "Suppression diode on " + d.name + " is the wrong way round." });
      }
      if (sup === "missing" && (d.type === "strikeFS" || d.type === "strikeFU" || d.type === "relay") && isWired(world, id)) {
        msgs.push({ level: "warn", text: "No suppression diode across " + d.name + ". The back-EMF spike can pit switch contacts and damage electronics. Band (cathode) to positive." });
      }
    });
    world.components.forEach(function (c) {
      if ((c.type === "edru" || c.type === "edru2") && c.state.operated) {
        world.components.forEach(function (lock) {
          if (lock.type === "mag" && isWired(world, lock.id) && devices[lock.id].holding) {
            msgs.push({ level: "crit", text: "CRITICAL. The emergency door release has been operated and the maglock is still holding. The door would stay locked in an emergency." });
          }
        });
      }
      if (c.type === "fire" && c.state.alarm) {
        world.components.forEach(function (lock) {
          if (lock.type === "mag" && isWired(world, lock.id) && devices[lock.id].holding) {
            msgs.push({ level: "crit", text: "CRITICAL. The fire alarm interface has operated and the maglock is still holding. The door would stay locked on fire." });
          }
        });
      }
    });
    return msgs;
  }

  function continuityNet(world, sim) {
    var keys = allTermKeys(world);
    var uf = makeUF(keys);
    world.wires.forEach(function (w) { uf.union(w.a, w.b); });
    var flags = (sim && sim.lastFlags) ? sim.lastFlags : emptyFlags();
    mechanicalUnions(world, uf);
    flaggedUnions(world, uf, flags);
    return uf;
  }

  function measure(world, sim, red, black, mode) {
    if (!red || !black) return { text: "Place both probes.", kind: "idle" };
    if (mode === "V") {
      if (!sim || !sim.powered) return { text: "Power up to measure voltage.", kind: "warn" };
      var rep = sim.lastReport;
      if (!rep) return { text: "Power up to measure voltage.", kind: "warn" };
      var vr = rep.v[red]; var vb = rep.v[black];
      if (typeof vr !== "number" || typeof vb !== "number") return { text: "Probe a terminal.", kind: "warn" };
      var diff = vr - vb;
      return { text: (diff >= 0 ? "+" : "") + diff.toFixed(2) + " V dc", kind: "reading", value: diff };
    }
    if (sim && sim.powered && (mode === "ohm" || mode === "cont")) {
      return { text: "Isolate the supply before continuity or resistance (GS38).", kind: "warn" };
    }
    var uf = continuityNet(world, sim);
    var joined = uf.find(red) === uf.find(black);
    if (mode === "cont") {
      return joined
        ? { text: "Beep — continuity (about 0.2 Ω)", kind: "reading", value: 0.2 }
        : { text: "Open circuit", kind: "reading", value: null };
    }
    if (joined) return { text: "0.2 Ω", kind: "reading", value: 0.2 };
    var direct = directOhms(world, red, black);
    if (direct) return direct;
    return { text: "OL", kind: "reading", value: null };
  }

  function directOhms(world, red, black) {
    var found = null;
    world.components.forEach(function (c) {
      var terms = TERMS[c.type];
      var hits = [];
      terms.forEach(function (t) {
        var k = keyOf(c.id, t);
        if (k === red || k === black) hits.push(t);
      });
      if (hits.length === 2) found = { c: c, hits: hits };
    });
    if (!found) return null;
    var c = found.c;
    var redTerm = found.hits.filter(function (t) { return keyOf(c.id, t) === red; })[0];
    if (c.type === "diode") {
      if (redTerm === "a") return { text: "Diode forward 0.58 V", kind: "reading", value: 0.58 };
      return { text: "OL (diode reverse)", kind: "reading", value: null };
    }
    if (c.type === "led") {
      if (redTerm === "a") return { text: "LED forward — about 1.8 V at the diode, high Ω", kind: "reading" };
      return { text: "OL (LED reverse)", kind: "reading" };
    }
    if (c.type === "strikeFS" || c.type === "strikeFU") return { text: "24 Ω (strike coil)", kind: "reading", value: 24 };
    if (c.type === "mag") return { text: "48 Ω (maglock coil)", kind: "reading", value: 48 };
    if (c.type === "relay" && ((found.hits.indexOf("a1") >= 0 && found.hits.indexOf("a2") >= 0))) {
      return { text: "400 Ω (relay coil)", kind: "reading", value: 400 };
    }
    if (c.type === "keypad" && found.hits.indexOf("p12") >= 0) return { text: "120 Ω (keypad supply)", kind: "reading", value: 120 };
    return null;
  }

  function pairSharesLock(world, lockId) {
    var pos = keyOf(lockId, "p");
    var neg = keyOf(lockId, "n");
    var groups = {};
    world.wires.forEach(function (w) {
      if (!w.pairId) return;
      if (!groups[w.pairId]) groups[w.pairId] = [];
      groups[w.pairId].push(w);
    });
    var ids = Object.keys(groups);
    for (var i = 0; i < ids.length; i++) {
      var wires = groups[ids[i]];
      if (wires.length < 2) continue;
      var touchP = wires.some(function (w) { return w.a === pos || w.b === pos; });
      var touchN = wires.some(function (w) { return w.a === neg || w.b === neg; });
      if (touchP && touchN && wires.every(function (w) { return w.cable === "pair" || w.cable === "audio"; })) return true;
    }
    return false;
  }

  function lockByType(world, type) {
    var list = world.components.filter(function (c) { return c.type === type && isWired(world, c.id); });
    return list[0] || null;
  }

  function freshSim(extra) {
    var s = { now: 0, powered: true, keypadUntil: 0, grantUntil: 0, audioUntil: 0 };
    if (extra) Object.keys(extra).forEach(function (k) { s[k] = extra[k]; });
    return s;
  }

  function powerOn(world, compType) {
    world.components.forEach(function (c) {
      if (c.type === "psu" && (!compType || c.type === compType)) c.state.output = true;
    });
  }

  function setAll(world, type, patch) {
    world.components.forEach(function (c) {
      if (c.type === type) Object.keys(patch).forEach(function (k) { c.state[k] = patch[k]; });
    });
  }

  function round1(n) { return Math.round(n * 10) / 10; }

  /* ---------- access decisions (practical 10) ---------- */

  function minutes(hhmm) {
    var p = String(hhmm || "0:0").split(":");
    return (+p[0]) * 60 + (+p[1] || 0);
  }

  function inTimeZone(tz, day, hhmm) {
    if (!tz) return false;
    var days = tz.days || [];
    if (days.indexOf(day) < 0) return false;
    var m = minutes(hhmm);
    return m >= minutes(tz.start) && m < minutes(tz.end);
  }

  function decideAccess(cfg, token, day, hhmm) {
    cfg = cfg || {};
    var users = cfg.users || [];
    var user = null;
    users.forEach(function (u) { if (String(u.token) === String(token)) user = u; });
    if (!user) return { grant: false, reason: "Access denied — unknown credential", user: null };
    var level = null;
    (cfg.levels || []).forEach(function (l) { if (l.id === user.levelId) level = l; });
    if (!level) return { grant: false, reason: "Access denied — no access level", user: user };
    var tz = null;
    (cfg.timeZones || []).forEach(function (t) { if (t.id === level.tzId) tz = t; });
    if (!inTimeZone(tz, day, hhmm)) return { grant: false, reason: "Access denied — outside time zone", user: user };
    return { grant: true, reason: "Access granted", user: user, openTime: cfg.openTime };
  }

  function witnessController(cfg) {
    var events = [];
    var issues = [];
    function log(text) { events.push(text); }
    var openTime = +cfg.openTime;
    var held = +cfg.heldTime;
    if (cfg.adminPass === "admin" || !cfg.passwordChanged) issues.push("Factory admin password has not been changed.");
    if (openTime !== 7) issues.push("Door open time is " + openTime + " s. The practical asks for 7 s.");
    if (held !== 30) issues.push("Door-held-open alarm is " + held + " s. The practical asks for 30 s.");
    var tzOk = (cfg.timeZones || []).some(function (tz) {
      return inTimeZone(tz, 1, "10:00") && !inTimeZone(tz, 1, "07:00") && !inTimeZone(tz, 6, "10:00");
    });
    if (!tzOk) issues.push("No time zone matches Mon–Fri daytime (in at Mon 10:00, out at Mon 07:00 and Saturday).");
    var students = (cfg.levels || []).filter(function (l) {
      return /student/i.test(l.name || "") && (cfg.timeZones || []).some(function (tz) {
        return tz.id === l.tzId && inTimeZone(tz, 1, "10:00") && !inTimeZone(tz, 1, "07:00");
      });
    })[0];
    if (!students) issues.push("Access level 'Students' is missing or is not tied to the daytime time zone.");
    var members = (cfg.users || []).filter(function (u) { return students && u.levelId === students.id && u.token; });
    if (members.length < 3) issues.push("Fewer than 3 fictitious users with tokens on the Students level.");
    if (cfg.fireMonitor === false) issues.push("Fire-input monitoring is switched off. The door hardware must still release, and the event should be logged.");

    var sample = members[0];
    var token = sample ? sample.token : "0000";
    var d1 = decideAccess(cfg, token, 1, "10:00");
    log("Mon 10:00 token " + token + " — " + d1.reason);
    var grantOk = !!(sample && d1.grant && openTime === 7);
    var d2 = decideAccess(cfg, token, 1, "07:00");
    log("Mon 07:00 token " + token + " — " + d2.reason);
    var tzDeny = !!(sample && !d2.grant && /time zone/.test(d2.reason));
    var d3 = decideAccess(cfg, "9999", 1, "10:00");

    FAULTS.forEach(function (f) {

      var earned = (idOk ? 12 : 0) + (fixOk ? 8 : 0) + (reOk ? 5 : 0);
      if (f.critical && !reOk) critical = true;
      tests.push({
        name: f.title,

        pass: earned === 25,

        detail: "Diagnosis " + (idOk ? "correct" : "wrong") + ", fix " + (fixOk ? "correct" : "wrong") + ", retest " + (reOk ? "passed" : "failed") + (s.detail ? " — " + s.detail : ""),

  function newCommission() {
    return {
      world: buildCommission(),
      sim: {
        now: 0, powered: true, grantUntil: 0, keypadUntil: 0, audioUntil: 0,
        clock: { day: 1, time: "10:00" },
        events: [], doorOpenedAt: null, heldLogged: false, forcedLogged: false
      },
      cfg: E.fittedCtrl(),
      seen: { usedMeter: false }
    };
  }

  function commComp(pack, type) { return comp(pack.world, type); }

  function commRead(pack) {
    var rep = E.evaluate(pack.world, pack.sim);
    pack.sim.lastReport = rep;
    var psu = commComp(pack, "psu");
    var mag = commComp(pack, "mag");
    var ctrl = commComp(pack, "ctrl");
    return {
      report: rep,
      psuV: rep.devices[psu.id].volts,
      magV: rep.devices[mag.id].volts,
      holding: rep.devices[mag.id].holding,
      released: rep.devices[mag.id].released,
      powered: rep.devices[ctrl.id].powered,
      doorShut: rep.devices[ctrl.id].doorShut,
      onBattery: rep.devices[psu.id].onBattery
    };
  }

  function commLog(pack, text) {
    pack.sim.events.unshift({ id: pack.sim.events.length + 1, when: "t=" + pack.sim.now.toFixed(0) + "s  " + dayName(pack.sim.clock.day) + " " + pack.sim.clock.time, text: text });
    if (pack.sim.events.length > 40) pack.sim.events.pop();
  }

  function dayName(d) {
    return ["", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"][d] || ("day " + d);
  }

  function commissionAct(pack, act, arg) {
    var w = pack.world, sim = pack.sim, cfg = pack.cfg;
    var psu = commComp(pack, "psu");
    var pte = commComp(pack, "pte");
    var door = commComp(pack, "door");
    var ed = commComp(pack, "edru");
    var fire = commComp(pack, "fire");
    if (act === "meter") {
      pack.seen.usedMeter = true;
      return commRead(pack);
    }
    if (act === "clock") {
      sim.clock.day = arg.day;
      sim.clock.time = arg.time;
      return commRead(pack);
    }
    if (act === "swipe") {
      var before = commRead(pack);
      if (!E.readerLinked(w, before.report)) {
        commLog(pack, "Swipe ignored — reader data cores are not on the controller.");
        return commRead(pack);
      }
      if (!before.powered) {
        commLog(pack, "Swipe ignored — controller has no supply.");
        return commRead(pack);
      }
      var token = arg && arg.token ? arg.token : "1001";
      var d = E.decideAccess(cfg, token, sim.clock.day, sim.clock.time);
      commLog(pack, "Token " + token + " — " + d.reason + (d.user ? " (" + d.user.name + ")" : "") + ".");
      if (d.grant) {
        sim.grantUntil = sim.now + (+cfg.openTime || 0);
        var after = commRead(pack);
        if (after.released) pack.seen.grant = true;
        else commLog(pack, "Controller granted access but the maglock is still holding — check the lock relay and the series contacts.");
      } else if (/unknown/.test(d.reason)) pack.seen.unknown = true;
      else if (/time zone/.test(d.reason)) pack.seen.tzDeny = true;
      return commRead(pack);
    }
    if (act === "rex") {
      pte.state.pressed = true;
      var r1 = commRead(pack);
      if (r1.report.devices[commComp(pack, "ctrl").id].rex) {
        sim.grantUntil = Math.max(sim.grantUntil || 0, sim.now + (+cfg.openTime || 7));
        pack.seen.rex = true;
        commLog(pack, "Request to exit. Door released for the open time. A following door-open is not door-forced.");
      } else commLog(pack, "Exit button pressed. Controller did not see the REX input.");
      pte.state.pressed = false;
      return commRead(pack);
    }
    if (act === "open") {
      var pre = commRead(pack);
      door.state.open = true;
      if (sim.doorOpenedAt === null) sim.doorOpenedAt = sim.now;
      var post = commRead(pack);
      var legitimate = !pre.holding;
      if (!legitimate && !sim.forcedLogged) {
        sim.forcedLogged = true;
        pack.seen.forced = true;
        commLog(pack, "Door forced alarm. The door left the frame while the maglock was holding.");
      } else if (legitimate) {
        pack.seen.openWhileFree = true;
        if (pack.seen.rex) pack.seen.rexNoForced = true;
        commLog(pack, "Door opened during a legitimate release. No door-forced alarm.");
      }
      if (!post.doorShut && door.state.open) pack.seen.contactAgrees = true;
      return post;
    }
    if (act === "close") {
      door.state.open = false;
      sim.doorOpenedAt = null;
      sim.heldLogged = false;
      sim.forcedLogged = false;
      commLog(pack, "Door closed.");
      return commRead(pack);
    }
    if (act === "advance") {
      var step = arg || 1;
      sim.now += step;
      if (door.state.open && sim.doorOpenedAt !== null && !sim.heldLogged && sim.now - sim.doorOpenedAt >= (+cfg.heldTime || 30)) {
        sim.heldLogged = true;
        pack.seen.held = true;
        commLog(pack, "Door held open alarm. The door has been open for " + cfg.heldTime + " s.");
      }
      return commRead(pack);
    }
    if (act === "edru") {
      ed.state.operated = true;
      var er = commRead(pack);
      if (er.released && !er.holding) {
        pack.seen.edru = true;
        commLog(pack, "EDRU operated. Maglock supply broken. Door released, independent of the controller.");
      } else {
        pack.seen.edruFail = true;
        commLog(pack, "CRITICAL. EDRU operated and the maglock is still holding.");
      }
      return er;
    }
    if (act === "edru-reset") {
      ed.state.operated = false;
      commLog(pack, "EDRU reset with the key.");
      return commRead(pack);
    }
    if (act === "fire") {
      fire.state.alarm = true;
      var fr = commRead(pack);
      if (fr.released && !fr.holding) {
        pack.seen.fire = true;
        commLog(pack, "Fire interface open. Maglock supply removed. Door released.");
      } else {
        pack.seen.fireFail = true;
        commLog(pack, "CRITICAL. Fire interface operated and the maglock is still holding.");
      }
      return fr;
    }
    if (act === "fire-reset") {
      fire.state.alarm = false;
      commLog(pack, "Fire interface reset. Confirm the door locks again before you sign off.");
      return commRead(pack);
    }
    if (act === "mains-fail") {
      psu.state.mains = false;
      psu.state.battery = true;
      psu.state.output = true;
      var mr = commRead(pack);
      if (mr.holding && mr.onBattery) {
        pack.seen.batteryHold = true;
        commLog(pack, "Mains failed. Running on battery at " + mr.psuV.toFixed(1) + " V. Maglock still holding.");
      } else commLog(pack, "Mains failed. Maglock state: " + (mr.holding ? "holding" : "released") + ".");
      return mr;
    }
    if (act === "mains-on") {
      psu.state.mains = true;
      psu.state.battery = true;
      psu.state.output = true;
      commLog(pack, "Mains restored.");
      return commRead(pack);
    }
    if (act === "all-off") {
      psu.state.output = false;
      psu.state.mains = false;
      psu.state.battery = false;
      var ar = commRead(pack);
      if (ar.released && !ar.holding) {
        pack.seen.allOff = true;
        commLog(pack, "PSU and battery off. Maglock released (fail-safe).");
      } else commLog(pack, "Supply off but the maglock is still holding — that should be impossible for a maglock.");
      return ar;
    }
    if (act === "all-on") {
      psu.state.output = true;
      psu.state.mains = true;
      psu.state.battery = true;
      ed.state.operated = false;
      fire.state.alarm = false;
      door.state.open = false;
      sim.grantUntil = 0;
      commLog(pack, "Supply restored. EDRU and fire interface reset. Door closed.");
      return commRead(pack);
    }
    return commRead(pack);
  }

  function elapsed() {

  function fmtTime(sec) {

    });

  function go(id) {
    if (id === "home" || id === "help" || id === "scores") {
      S.view = id; S.mission = null; S.result = null; draw(); return;
    }
    S.view = "mission";
    S.mission = id;
    S.result = null;
    S.pending = null;
    S.openPair = null;
    S.selected = null;
    S.tab = "brief";
    S.arm = null;
    S.tool = "wire";
    S.lastReport = null;
    S.sim = freshSim();
    S.world = E.createWorld();
    S.p07 = { stage: "A", partA: null };
    if (id === "fault") { S.faultIndex = 0; S.faultSub = {}; loadFault(0); return; }
    if (id === "comm") { startComm(); return; }
    if (id === "p10") S.sim.ctrl = E.blankCtrl();
    draw();
  }

  function placePart(type, x, y) {
    var m = mission();
    if (SINGLE[type]) {
      var existing = null;
      S.world.components.forEach(function (c) { if (c.type === type) existing = c; });
      if (existing) { S.selected = { kind: "comp", id: existing.id }; draw(); return existing; }
    }
    var st = (m && m.partState && m.partState[type]) ? JSON.parse(JSON.stringify(m.partState[type])) : {};
    if (x == null) {
      var n = S.world.components.length;
      x = 20 + (n % 4) * 230;
      y = 24 + Math.floor(n / 4) * 210;
    }
    var c = E.addComponent(S.world, type, x, y, st);
    S.selected = { kind: "comp", id: c.id };
    S.lastReport = null;
    draw();
    return c;
  }

  function runEval(commit) {
    S.lastReport = E.evaluate(S.world, S.sim, { commit: !!commit });
    S.sim.lastFlags = S.lastReport.flags;
    S.sim.powered = S.world.components.some(function (c) { return c.type === "psu" && c.state.output; });
  }
  function doPower(on) {
    S.world.components.forEach(function (c) { if (c.type === "psu") c.state.output = !!on; });
    S.sim.powered = !!on;
    if (!on) S.world.fuseBlown = S.world.fuseBlown;
    runEval(!!on);
    draw();
  }

    else if (S.mission === "p00") main.innerHTML = viewId();
    else if (S.mission === "know") main.innerHTML = viewKnow();
    else if (S.mission === "p10") main.innerHTML = viewCtrl();
    else if (S.mission === "fault") main.innerHTML = viewFault();
    else if (S.mission === "comm") main.innerHTML = viewComm();

      "<p>The circuits are practicals 00 to 10: twisted-pair lock power, an Adams Rite fail-secure strike on an exit button, a stand-alone keypad, a CDVI or Securitron maglock on a normally closed exit, Hoyles or STI green emergency releases, held-energised relays, fail-safe against fail-secure, a Bell 801 door entry, and a Paxton Net2 plus. Videx VX2300 is the 2-wire comparison in the door-entry mission. If the emergency device leaves the door locked, the mark is a critical fail.</p>" +

  function heroHTML() {
    var rep = S.lastReport;
    var title = "Supply isolated";
    var detail = "Build the circuit, then power up.";
    var crit = false;
    if (rep && S.sim.powered) {
      var bits = [];
      Object.keys(rep.devices).forEach(function (id) {
        var d = rep.devices[id];
        if (d.type === "mag" || d.type === "strikeFS" || d.type === "strikeFU") {
          if (!E.isWired(S.world, id)) return;
          bits.push(d.name + " " + (d.released ? "RELEASED" : "LOCKED") + " " + d.volts.toFixed(1) + " V");
        }
      });
      title = bits.length ? bits.join(" · ") : "Powered";
      detail = "Supply current " + (rep.fuseBlown ? "fuse open" : rep.current.toFixed(2) + " A");
      crit = (rep.messages || []).some(function (m) { return m.level === "crit"; });
      if (crit) title = "CRITICAL — door still locked";
    } else if (rep && rep.fuseBlown) title = "Fuse open";
    var leaf = crit ? "#8d1d18" : (title.indexOf("RELEASED") >= 0 ? "#2e7d32" : "#c6a15b");
    return '<div class="hero-door"><svg class="door-svg" viewBox="0 0 74 90" aria-hidden="true"><rect x="8" y="6" width="58" height="80" rx="2" fill="#4e342e"/><rect x="14" y="12" width="40" height="68" fill="' + leaf + '"/><circle cx="46" cy="48" r="3" fill="#f6e7c1"/></svg><div><strong>' + esc(title) + '</strong><div>' + esc(detail) + "</div></div></div>";
  }

  function liveHTML() {
    var rep = S.lastReport;
    if (!rep) return "<p>No reading yet.</p>";
    var lines = [];
    if (S.world.fuseBlown || rep.fuseBlown) lines.push('<p class="msg bad">Fuse open. Current went past 2 A or +12 V is shorted to 0 V. A diode with the band to negative does this as soon as the coil is switched on.</p>');
    Object.keys(rep.devices).forEach(function (id) {
      var d = rep.devices[id];
      if (!E.isWired(S.world, id) && d.type !== "psu") return;
      if (d.type === "psu") lines.push("<p>PSU output " + d.volts.toFixed(2) + " V" + (d.onBattery ? " on battery" : "") + "</p>");
      if (d.type === "mag" || d.type === "strikeFS" || d.type === "strikeFU") {
        lines.push("<p>" + esc(d.name) + " " + (d.released ? "RELEASED" : "LOCKED") + " at " + d.volts.toFixed(1) + " V</p>");
      }
      if (d.type === "relay") lines.push("<p>Relay " + (d.relayOn ? "ENERGISED" : "dropped") + ", coil " + d.coilV.toFixed(1) + " V</p>");
      if (d.type === "led") lines.push("<p>LED " + (d.ledOn ? "ON" : "off") + "</p>");
      if (d.type === "keypad") lines.push("<p>Keypad " + (d.powered ? "powered" : "dead") + ", relay " + (d.relayOn ? "ON" : "off") + ", REX " + (d.rex ? "seen" : "open") + "</p>");
      if (d.type === "ctrl") lines.push("<p>Controller " + (d.powered ? "powered" : "dead") + ", lock relay " + (d.relayOn ? "ON (released)" : "off (locked contact)") + "</p>");
    });
    if (rep.speech && (compType("panel"))) {
      lines.push("<p>Speech path " + (rep.speech.speech ? "OK" : "open") + ". Handset " + (rep.speech.ringing ? "RINGING" : "quiet") + ".</p>");
    }
    (rep.messages || []).forEach(function (m) {
      if (m.level === "warn" || m.level === "bad" || m.level === "crit") lines.push('<p class="msg ' + m.level + '">' + esc(m.text) + "</p>");
    });
    var supNoted = {};
    Object.keys(rep.suppression || {}).forEach(function (id) {
      if (rep.suppression[id] === "correct") supNoted[id] = 1;
    });
    return '<div id="live-summary">' + (lines.join("") || "<p>Powered. Operate a switch or a button.</p>") + "</div>";
  }
  function compType(type) {
    return S.world && S.world.components.some(function (c) { return c.type === type; });
  }

  function deviceHTML(c) {
    var d = S.lastReport && S.lastReport.devices[c.id];
    var face = "";
    if (c.type === "psu") {
      var fuse = S.world.fuseBlown ? '<span class="pill bad">FUSE OPEN</span>' : '<span class="pill ok">FUSE 2 A</span>';
      var src = !c.state.output ? "Isolated" : (c.state.mains ? (c.state.vset || 13.6) + " V" : (c.state.battery ? "Battery" : "No source"));
      face = fuse + " <span class='pill'>" + esc(src) + "</span>";
      if (!c.state.battery) face += '<div><button type="button" class="btn" data-act="op" data-op="battery" data-id="' + c.id + '">Fit battery</button></div>';
      else face += '<div><button type="button" class="btn" data-act="op" data-op="mains" data-id="' + c.id + '">' + (c.state.mains ? "Mains fail" : "Mains on") + "</button></div>";
    } else if (c.type === "sw") {
      face = '<button type="button" class="btn' + (c.state.on ? " primary" : "") + '" data-act="op" data-op="toggle" data-id="' + c.id + '">' + (c.state.on ? "Switch ON" : "Switch off") + "</button>";
    } else if (c.type === "pte") {
      face = '<button type="button" class="btn' + (c.state.pressed ? " primary" : "") + '" data-act="op" data-op="toggle" data-id="' + c.id + '">' + (c.state.pressed ? "EXIT HELD" : "Press exit") + "</button>";
    } else if (c.type === "edru" || c.type === "edru2") {
      face = '<div class="face"><span class="lamp green' + (c.state.operated ? "" : " on") + '"></span><button type="button" class="btn bad" data-act="op" data-op="toggle" data-id="' + c.id + '">' + (c.state.operated ? "OPERATED" : "Set — push element") + "</button></div>";
      if (c.state.operated) face += '<button type="button" class="btn" data-act="op" data-op="reset" data-id="' + c.id + '">Reset with key</button>';
    } else if (c.type === "relay") {
      face = '<span class="pill ' + (d && d.relayOn ? "ok" : "") + '">' + (d && d.relayOn ? "COIL IN" : "Coil out") + "</span>";
    } else if (c.type === "strikeFS" || c.type === "strikeFU" || c.type === "mag") {
      var word = d ? (d.released ? "RELEASED" : "LOCKED") : "—";
      var cls = d && d.released ? "ok" : "bad";
      face = '<span class="pill ' + cls + '">' + word + "</span>";
      if (d && E.isWired(S.world, c.id)) face += " <span>" + d.volts.toFixed(1) + " V</span>";
    } else if (c.type === "led") {
      face = '<div class="face"><span class="led-dot' + (d && d.ledOn ? " on" : "") + '"></span>' + (d && d.ledOn ? "ON" : "off") + "</div>";
    } else if (c.type === "diode") {
      face = "Band marks the cathode (K).";
    } else if (c.type === "fire") {
      face = '<button type="button" class="btn' + (c.state.alarm ? " bad" : "") + '" data-act="op" data-op="toggle" data-id="' + c.id + '">' + (c.state.alarm ? "FIRE — contact open" : "Healthy — contact closed") + "</button>";
    } else if (c.type === "door") {
      face = '<button type="button" class="btn" data-act="op" data-op="door" data-id="' + c.id + '">' + (c.state.open ? "Door open — shut it" : "Open the door") + "</button>";
    } else if (c.type === "reel") {
      var len = c.state.len === "50" ? "50 m, 1 core" : c.state.len === "50p" ? "50 m, 2 cores" : "Short link";
      face = '<button type="button" class="btn" data-act="op" data-op="reel" data-id="' + c.id + '">' + len + "</button>";
    } else if (c.type === "panel") {
      var ring = S.lastReport && S.lastReport.speech && S.lastReport.speech.ringing;
      face = '<button type="button" class="btn' + (c.state.call ? " primary" : "") + '" data-act="op" data-op="call" data-id="' + c.id + '">' + (c.state.call ? "Calling" : "Call") + "</button> " + (ring ? "Handset ringing" : "");
    } else if (c.type === "handset") {
      face = '<button type="button" class="btn' + (c.state.release ? " primary" : "") + '" data-act="op" data-op="release" data-id="' + c.id + '">' + (c.state.release ? "Z–O HELD" : "Lock button") + "</button>";
    } else if (c.type === "reader") {
      face = '<button type="button" class="btn" data-act="op" data-op="swipe" data-id="' + c.id + '">Swipe</button>';
    } else if (c.type === "ctrl") {
      face = '<button type="button" class="btn" data-act="op" data-op="grant" data-id="' + c.id + '">Grant 7 s</button>';
    } else if (c.type === "keypad") {
      face = "Use the keypad panel.";
    } else if (c.type === "jb") {
      face = "Each screw is its own way.";
    }
    var terms = (TERM_LABEL[c.type] || []).map(function (t) {
      var key = c.id + "." + t[0];
      var cls = "term" + (S.pending === key ? " hot" : "") + (S.meter.red === key ? " probe-red" : "") + (S.meter.black === key ? " probe-black" : "");
      return '<button type="button" class="' + cls + '" data-act="term" data-term="' + key + '">' + esc(t[1]) + "</button>";
    }).join("");
    var wide = (c.type === "ctrl" || c.type === "keypad" || c.type === "edru2" || c.type === "relay") ? " style=\"width:250px\"" : "";
    var sel = S.selected && S.selected.kind === "comp" && S.selected.id === c.id ? " sel" : "";
    return '<article class="dev' + sel + '" id="dev-' + c.id + '"' + wide + ' style="left:' + c.x + "px;top:" + c.y + 'px">' +
      '<header data-drag="1" data-id="' + c.id + '">' + esc(E.CATALOGUE[c.type].name) + "<small>" + esc(E.CATALOGUE[c.type].blurb) + "</small></header>" +
      '<div class="body">' + face + "</div><div class=\"terms\">" + terms + "</div></article>";
  }

  function boardHTML() {
    var h = 760;
    (S.world.components || []).forEach(function (c) { h = Math.max(h, c.y + 250); });
    var parts = (S.world.components || []).map(deviceHTML).join("");
    return heroHTML() + toolbarHTML() + trayHTML() +
      '<div class="board-wrap"><div class="board" id="board" style="height:' + h + 'px">' +
      '<svg class="wires" id="wires"></svg>' + parts + "</div></div>";
  }

  function asideHTML(extra) {
    var m = mission();
    var tabs = [["brief", "Brief"], ["live", "Live"], ["ask", "Questions"], ["mark", "Mark"]];
    if (m.id === "p03") tabs.splice(2, 0, ["pad", "Keypad"]);
    var bar = '<div class="tabs no-print">' + tabs.map(function (t) {
      return '<button type="button" data-act="tab" data-tab="' + t[0] + '" class="' + (S.tab === t[0] ? "on" : "") + '">' + t[1] + "</button>";
    }).join("") + "</div>";
    var body = "";
    if (S.tab === "brief") body = '<div class="prose">' + briefHTML(m) + "</div>";
    else if (S.tab === "live") body = liveHTML();
    else if (S.tab === "ask") body = questionsHTML(m);
    else if (S.tab === "pad") body = keypadHTML();
    else body = resultHTML() + markButtons();
    return '<aside class="aside card">' + bar + body + (extra || "") + "</aside>";
  }
  function markButtons() {
    if (S.mission === "sand") return "<p>Nothing on the sandbox is marked. Use it to try a circuit before you sit a mission.</p>";
    var label = "Mark this mission";
    if (S.mission === "p07" && S.p07.stage !== "C") label = "Mark Part A";
    else if (S.mission === "p07") label = "Mark Part C";
    var extra = "";

    return '<div class="no-print" style="margin-top:8px"><button type="button" class="btn primary" data-act="mark" id="btn-mark">' + label + "</button> " + extra + ' <button type="button" class="btn" data-act="clear-board">Clear board</button></div>';
  }

  function viewWire() {
    var m = mission();
    var note = "";
    if (S.mission === "p07") {
      note = '<p class="msg warn">' + (S.p07.stage === "C"
        ? "Part C. Fit the fail-safe strike and rebuild the held-energised circuit. Part A is already stored."
        : "Part A. Fail-secure strike, EDRU contact that closes when operated, relay applies power. Mark Part A before you rewire.") + "</p>";
    }
    if (S.pending) note += '<p class="msg">First terminal selected. Click the terminal it lands on. Click it again to cancel.</p>';
    if (S.openPair) note += '<p class="msg">Pair started. The next core completes it.</p>';
    return headBlock(m) + note + '<div class="work"><div>' + boardHTML() + '</div>' + asideHTML("") + "</div>";
  }

  function keypadHTML() {
    var k = S.sim.keypadProg;
    var keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "C", "0", "OK"].map(function (n) {
      return '<button type="button" class="btn" data-act="kp" data-key="' + n + '" style="width:52px;height:42px">' + n + "</button>";
    }).join("");
    var menu = "";
    if (k.mode === "menu") {
      menu = '<div style="margin-top:8px"><button type="button" class="btn" data-act="kp-mode" data-mode="set-master">Change master</button> ' +
        '<button type="button" class="btn" data-act="kp-mode" data-mode="add-user">Add user</button> ' +
        '<button type="button" class="btn" data-act="kp-mode" data-mode="set-time">Relay time</button> ' +
        '<button type="button" class="btn" data-act="kp-mode" data-mode="">Leave</button></div>';
    } else {
      menu = '<div style="margin-top:8px"><button type="button" class="btn" data-act="kp-mode" data-mode="need-master">Program</button></div>';
    }
    return '<p class="kicker">Stand-alone keypad</p><p>' + esc(k.msg || "") + '</p><p style="font-family:Consolas,monospace;font-size:22px;letter-spacing:.2em">' + esc(k.buffer || "—") + "</p>" +
      '<div style="display:flex;flex-wrap:wrap;gap:4px;width:180px">' + keys + "</div>" + menu +
      "<p>Master " + (k.changed ? "changed" : "still factory 1234") + ". Users " + k.users.length + ". Relay " + k.relayTime + " s.</p>";
  }

  function layoutWires() {
    var svg = document.getElementById("wires");
    var board = document.getElementById("board");
    if (!svg || !board || !S.world) return;
    var br = board.getBoundingClientRect();
    var w = board.clientWidth, h = board.clientHeight;
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    var html = "";
    S.world.wires.forEach(function (wire) {
      var a = termPoint(wire.a, br);
      var b = termPoint(wire.b, br);
      if (!a || !b) return;
      var mx = (a.x + b.x) / 2;
      var my = (a.y + b.y) / 2 + Math.min(70, Math.abs(b.x - a.x) * 0.12 + 18);
      var d = "M " + a.x + " " + a.y + " Q " + mx + " " + my + " " + b.x + " " + b.y;
      var col = COLOUR_HEX[wire.colour] || "#222";
      var sel = S.selected && S.selected.kind === "wire" && S.selected.id === wire.id;
      if (wire.colour === "white" || wire.colour === "yellow") {
        html += '<path class="vis" d="' + d + '" stroke="#333" stroke-width="6"></path>';
      }
      html += '<path class="hit" data-act="pick-wire" data-id="' + wire.id + '" d="' + d + '"></path>';
      html += '<path class="vis' + (sel ? " sel" : "") + '" d="' + d + '" stroke="' + col + '"></path>';
      if (wire.pairId) {
        html += '<text x="' + mx + '" y="' + (my - 6) + '">' + esc(wire.pairId) + "</text>";
      }
    });
    svg.innerHTML = html;
  }
  function termPoint(key, br) {
    var el = document.querySelector('[data-term="' + key + '"]');
    if (!el) return null;
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2 - br.left, y: r.top + r.height / 2 - br.top };
  }

  function onTerm(key) {
    if (S.tool === "meter") {
      if (!S.meter.red || (S.meter.red && S.meter.black)) {
        S.meter.red = key; S.meter.black = null; S.meter.text = "Red on " + key + ". Click black.";
      } else {
        S.meter.black = key;
        var reading = E.measure(S.world, S.sim, S.meter.red, S.meter.black, S.meter.mode);
        S.meter.text = reading.text;
        if (S.meter.mode === "V" && S.commPack) S.commPack.seen.usedMeter = true;
      }
      draw();
      return;
    }
    if (!S.pending) { S.pending = key; draw(); return; }
    if (S.pending === key) { S.pending = null; draw(); return; }
    var pair = null;
    if (S.cable === "pair" || S.cable === "audio") {
      if (!S.openPair) { S.openPair = "pair" + S.world.nextPair++; pair = S.openPair; }
      else { pair = S.openPair; S.openPair = null; }
    }
    E.addWire(S.world, S.pending, key, S.colour, S.cable, pair);
    S.pending = null;
    S.lastReport = null;
    draw();
  }

  function operate(id, op) {
    var c = byId(id);
    if (!c) return;
    if (op === "toggle") {
      if (c.type === "sw") c.state.on = !c.state.on;
      else if (c.type === "pte") c.state.pressed = !c.state.pressed;
      else if (c.type === "edru" || c.type === "edru2") c.state.operated = !c.state.operated;
      else if (c.type === "fire") c.state.alarm = !c.state.alarm;
    } else if (op === "reset") c.state.operated = false;
    else if (op === "battery") c.state.battery = !c.state.battery;
    else if (op === "mains") c.state.mains = !c.state.mains;
    else if (op === "reel") c.state.len = c.state.len === "short" ? "50" : c.state.len === "50" ? "50p" : "short";
    else if (op === "call") c.state.call = !c.state.call;
    else if (op === "release") c.state.release = !c.state.release;
    else if (op === "door") {
      if (c.state.open) c.state.open = false;
      else {
        var held = false;
        if (S.lastReport) {
          Object.keys(S.lastReport.devices).forEach(function (k) {
            var d = S.lastReport.devices[k];
            if ((d.type === "mag" || d.type === "strikeFU") && d.holding) held = true;
            if (d.type === "strikeFS" && d.locked && E.isWired(S.world, k)) held = true;
          });
        }
        if (held && S.mission !== "comm" && S.mission !== "fault" && S.mission !== "sand") {
          S.meter.text = "The lock is holding the door.";
          draw();
          return;
        }
        c.state.open = true;
      }
    } else if (op === "grant") S.sim.grantUntil = (S.sim.now || 0) + 7;
    else if (op === "swipe") {
      if (S.lastReport && E.readerLinked(S.world, S.lastReport)) S.sim.grantUntil = (S.sim.now || 0) + 7;
      else S.meter.text = "Reader data cores are not on the controller.";
    }
    if (S.sim.powered || (S.world.components.some(function (p) { return p.type === "psu" && p.state.output; }))) runEval(true);
    else runEval(false);
    draw();
  }

  function removeSelected() {
    if (!S.selected) return;
    if (S.selected.kind === "wire") E.removeWire(S.world, S.selected.id);
    else E.removeComponent(S.world, S.selected.id);
    S.selected = null;
    S.lastReport = null;
    draw();
  }

  function doMark() {
    var m = mission();
    if (!m) return;
    var answers = S.answerMap[m.id] || [];
    var progress = {};
    if (m.id === "p00") {
      S.idState.answers = answers;
      progress = S.idState;
    } else if (m.id === "p07") progress = { stage: S.p07.stage, partA: S.p07.partA };
    else if (m.id === "fault") progress = { sub: S.faultSub };
    else if (m.id === "comm") {
      ["psuV", "magV", "ahCalc"].forEach(function (key) {
        var el = document.getElementById(key === "psuV" ? "comm-psu" : key === "magV" ? "comm-mag" : "comm-ah");
        if (el && el.value !== "") S.commForm[key] = parseFloat(el.value);
      });
      var bat = document.getElementById("comm-bat");
      if (bat) S.commForm.battery = bat.value;
      var sn = document.getElementById("comm-sign");
      if (sn) S.commForm.signName = sn.value;
      var signed = document.getElementById("comm-signed");
      if (signed) S.commForm.signed = signed.checked;
      var fr = document.querySelector('input[name="fire-ans"]:checked');
      if (fr) S.commForm.fireAnswer = fr.value;
      S.commForm.seen = S.commPack ? S.commPack.seen : {};
      progress = { form: S.commForm };
    }
    var hints = S.hintCount[m.id] || 0;
    var r = M.scoreMission(m.id, S.world, S.sim, answers, hints, progress);
    if (m.id === "p07" && r.partial) {
      S.p07.partA = r;
      S.p07.stage = "C";
      r.note = "Part A is stored. Clear nothing you still need, fit the fail-safe strike, and rebuild the held-energised circuit. Then mark Part C.";
      S.result = r;
      S.tab = "mark";
      draw();
      return;
    }
    S.result = r;
    if (!r.partial) saveScore(m.id, r);
    S.tab = "mark";
    draw();
  }
  function saveScore(id, r) {
    var prev = S.scores[id] || { best: -1, attempts: 0, passed: false };
    prev.attempts += 1;
    var sec = Math.round(elapsed());
    if (r.score >= prev.best) {
      prev.best = r.score;
      prev.critical = !!r.critical;
      prev.date = new Date().toISOString();
      prev.hints = S.hintCount[id] || 0;
      prev.seconds = sec;
    }
    if (r.passed) prev.passed = true;
    prev.last = r.score;
    S.scores[id] = prev;
    persist();
    buildNav();
  }

  function loadFault(index) {
    var f = M.FAULTS[index];
    S.faultIndex = index;
    S.world = M.startFault(f.id);
    S.sim = freshSim();
    S.sim.powered = false;
    S.lastReport = null;
    S.meter = { mode: "V", red: null, black: null, text: "Meter idle" };
    S.tool = "meter";
    draw();
  }
  function submitFault(choice, fix) {
    var f = M.FAULTS[S.faultIndex];
    if (S.faultSub[f.id] && S.faultSub[f.id].submitted) return;
    M.applyFix(S.world, f.id, fix);
    S.world.fuseBlown = false;
    var rt = M.retestFault(S.world, f.id);
    S.faultSub[f.id] = { submitted: true, choice: choice, fix: fix, retestPass: rt.pass, detail: rt.detail };
    runEval(true);
    S.tab = "mark";
    draw();
  }

  function startComm() {
    S.commPack = M.newCommission();
    S.world = S.commPack.world;
    S.sim = S.commPack.sim;
    S.sim.powered = true;
    S.commForm = { psuV: "", magV: "", ahCalc: "", battery: "", fireAnswer: "", signName: S.name || "", signed: false };
    M.commissionAct(S.commPack, "meter");
    S.lastReport = S.sim.lastReport;
    draw();
  }
  function doComm(act, arg) {
    if (!S.commPack) return;
    M.commissionAct(S.commPack, act, arg);
    S.lastReport = S.sim.lastReport;
    var psu = S.world.components.filter(function (c) { return c.type === "psu"; })[0];
    S.sim.powered = !!(psu && psu.state.output);
    draw();
  }

  function viewFault() {
    var f = M.FAULTS[S.faultIndex];
    var m = mission();
    var opts = f.options.map(function (op, i) {
      return '<label><input type="radio" name="fault-choice" value="' + i + '"> ' + esc(op) + "</label>";
    }).join("");
    var fixes = f.fixes.map(function (fx) {
      return '<label><input type="radio" name="fault-fix" value="' + fx.id + '"> ' + esc(fx.label) + "</label>";
    }).join("");
    var done = S.faultSub[f.id] && S.faultSub[f.id].submitted;
    var why = "";
    if (done) why = "<p>Your diagnosis and repair have been recorded.</p><p>Retest: " + esc(S.faultSub[f.id].detail) + " — " + (S.faultSub[f.id].retestPass ? "passed" : "not passed") + ".</p>";

  function kpPress(key) {
    var k = S.sim.keypadProg;
    if (key === "C") { k.buffer = ""; draw(); return; }
    if (key !== "OK") {
      k.buffer = (k.buffer || "") + key;
      if (k.buffer.length > 8) k.buffer = k.buffer.slice(0, 8);
      draw();
      return;
    }
    var code = k.buffer || "";
    k.buffer = "";
    if (k.mode === "need-master") {
      k.msg = code === k.master ? "Programming menu." : "Wrong master code.";
      if (code === k.master) k.mode = "menu";
    } else if (k.mode === "set-master") {
      if (code.length < 4) k.msg = "Use at least 4 digits.";
      else { k.master = code; k.changed = true; k.mode = "menu"; k.msg = "Master code changed."; }
    } else if (k.mode === "add-user") {
      if (!k.changed || k.master === "1234") k.msg = "Change the factory master before you add a user.";
      else if (code.length < 4) k.msg = "User code needs at least 4 digits.";
      else { k.users.push(code); k.mode = "menu"; k.msg = "User stored. " + k.users.length + " users."; }
    } else if (k.mode === "set-time") {
      var n = parseInt(code, 10);
      if (n >= 1 && n <= 30) { k.relayTime = n; k.mode = "menu"; k.msg = "Relay time " + n + " seconds."; }
      else k.msg = "Enter a number from 1 to 30.";
    } else {
      if (!S.sim.powered) k.msg = "The keypad has no supply.";
      else if (k.users.indexOf(code) >= 0) {
        S.sim.keypadUntil = (S.sim.now || 0) + (+k.relayTime || 0);
        k.msg = "Accepted. Relay on for " + k.relayTime + " s. Use +1 s / +5 s to watch it relock.";
        runEval(true);
      } else k.msg = "Rejected.";
    }
    S.tab = "pad";
    draw();
  }
