    else if (act === "colour") { S.colour = t.getAttribute("data-colour"); draw(); }
    else if (act === "tool") { S.tool = t.getAttribute("data-tool"); S.pending = null; draw(); }
    else if (act === "meter-mode") { S.tool = "meter"; S.meter.mode = t.getAttribute("data-mode"); S.meter.red = null; S.meter.black = null; S.meter.text = "Click the red probe terminal."; draw(); }
    else if (act === "term") onTerm(t.getAttribute("data-term"));
    else if (act === "power") doPower(true);
    else if (act === "isolate") doPower(false);
    else if (act === "fuse") { S.world.fuseBlown = false; if (S.sim.powered) runEval(true); draw(); }
    else if (act === "remove") removeSelected();
    else if (act === "pick-wire") { S.selected = { kind: "wire", id: t.getAttribute("data-id") }; draw(); }
    else if (act === "op") operate(t.getAttribute("data-id"), t.getAttribute("data-op"));
    else if (act === "advance") {
      S.sim.now = (S.sim.now || 0) + parseFloat(t.getAttribute("data-sec") || "1");
      if (S.sim.powered) runEval(false);
      draw();
    } else if (act === "tab") { S.tab = t.getAttribute("data-tab"); draw(); }
    else if (act === "hint") {
      var m = mission();
      var n = S.hintCount[m.id] || 0;
      if (m.hints && n < m.hints.length) S.hintCount[m.id] = n + 1;
      persist();
      draw();
    } else if (act === "timer") {
      var tm = S.timer[S.mission] || { spent: 0 };
      if (tm.start) { tm.spent = elapsed(); tm.start = null; }
      else tm.start = Date.now();
      S.timer[S.mission] = tm;
      draw();
    } else if (act === "mark") doMark();
    else if (act === "clear-board") {
      var id = S.mission;
      go(id);
    } else if (act === "kp") kpPress(t.getAttribute("data-key"));
    else if (act === "kp-mode") { S.sim.keypadProg.mode = t.getAttribute("data-mode"); S.sim.keypadProg.buffer = ""; draw(); }
    else if (act === "fault-go") loadFault(+t.getAttribute("data-i"));
    else if (act === "fault-restore") {
      var cur = M.FAULTS[S.faultIndex];
      if (S.faultSub[cur.id] && S.faultSub[cur.id].submitted) return;
      loadFault(S.faultIndex);
    }
    else if (act === "fault-submit") {
      var choice = document.querySelector('input[name="fault-choice"]:checked');
      var fix = document.querySelector('input[name="fault-fix"]:checked');
      if (!choice || !fix) { window.alert("Choose the fault and the repair first."); return; }
      submitFault(+choice.value, fix.value);
    } else if (act === "comm") {
      var name = t.getAttribute("data-comm");
      if (name === "swipe") doComm("swipe", { token: t.getAttribute("data-token") });
      else if (name === "advance") doComm("advance", parseFloat(t.getAttribute("data-sec")));
      else doComm(name);
    } else if (act === "comm-clock") {
      doComm("clock", { day: +document.getElementById("comm-day").value, time: document.getElementById("comm-time").value });
    } else if (act === "pass") {
      var np = document.getElementById("new-pass").value.trim();
      if (np.length < 4 || np.toLowerCase() === "admin") { window.alert("Choose a new password of at least 4 characters, and not admin."); return; }
      S.sim.ctrl.adminPass = np; S.sim.ctrl.passwordChanged = true; draw();
    } else if (act === "save-door") saveDoor();
    else if (act === "tz-add") addZone();
    else if (act === "tz-del") { S.sim.ctrl.timeZones = S.sim.ctrl.timeZones.filter(function (z) { return z.id !== t.getAttribute("data-id"); }); draw(); }
    else if (act === "lv-add") {
      var ln = document.getElementById("lv-name").value.trim();
      var tz = document.getElementById("lv-tz").value;
      if (!ln || !tz) return;
      S.sim.ctrl.levels.push({ id: "lv" + S.sim.ctrl.nextId++, name: ln, tzId: tz });
      draw();
    } else if (act === "lv-del") { S.sim.ctrl.levels = S.sim.ctrl.levels.filter(function (z) { return z.id !== t.getAttribute("data-id"); }); draw(); }
    else if (act === "user-add") {
      var un = document.getElementById("u-name").value.trim();
      var tok = document.getElementById("u-token").value.trim();
      var lv = document.getElementById("u-level").value;
      if (!un || !tok || !lv) return;
      S.sim.ctrl.users.push({ id: "u" + S.sim.ctrl.nextId++, name: un, token: tok, levelId: lv });
      draw();
    } else if (act === "user-del") { S.sim.ctrl.users = S.sim.ctrl.users.filter(function (z) { return z.id !== t.getAttribute("data-id"); }); draw(); }
    else if (act === "try-swipe") {
      var d = E.decideAccess(S.sim.ctrl, document.getElementById("try-token").value.trim(), +document.getElementById("try-day").value, document.getElementById("try-time").value);
      S.practice = S.practice || [];
      S.practice.unshift(M.dayName(+document.getElementById("try-day").value) + " " + document.getElementById("try-time").value + " token " + document.getElementById("try-token").value.trim() + " — " + d.reason);
      draw();
    } else if (act === "ctrl-blank") { S.sim.ctrl = E.blankCtrl(); S.practice = []; draw(); }
    else if (act === "arm-fn") { S.armFn = t.getAttribute("data-fn"); draw(); }
    else if (act === "set-mode") { S.idState.modes[t.getAttribute("data-card")] = t.getAttribute("data-mode"); persist(); draw(); }
    else if (act === "csv") doCSV();
    else if (act === "print") doPrint();
    else if (act === "clear") {
      if (window.confirm("Clear this browser? The apprentice name and scores stored here will be removed.")) {
        localStorage.removeItem(KEY);
        location.reload();
      }
    }
  });

  document.addEventListener("input", function (e) {
    var t = e.target;
    if (!t.dataset || !t.dataset.form) return;
    if (t.dataset.form === "psuV" || t.dataset.form === "magV" || t.dataset.form === "ahCalc") S.commForm[t.dataset.form] = t.value === "" ? "" : parseFloat(t.value);
    else if (t.type !== "checkbox") S.commForm[t.dataset.form] = t.value;
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute("data-act") === "cable") { S.cable = t.value; S.openPair = null; return; }
    if (t.getAttribute("data-q") != null && S.mission) {
      if (!S.answerMap[S.mission]) S.answerMap[S.mission] = [];
      S.answerMap[S.mission][+t.getAttribute("data-q")] = +t.value;
    }
    if (t.dataset && t.dataset.form) {
      if (t.type === "checkbox") S.commForm[t.dataset.form] = t.checked;
      else if (t.dataset.form === "psuV" || t.dataset.form === "magV" || t.dataset.form === "ahCalc") S.commForm[t.dataset.form] = t.value === "" ? "" : parseFloat(t.value);
      else S.commForm[t.dataset.form] = t.value;
    }
  });

  document.addEventListener("pointerdown", function (e) {
    var h = e.target.closest("[data-drag]");
    if (!h || e.target.closest("button")) return;
    var c = byId(h.getAttribute("data-id"));
    if (!c) return;
    S.drag = { id: c.id, x: c.x, y: c.y, ox: e.clientX, oy: e.clientY, moved: false };
  });
  document.addEventListener("pointermove", function (e) {
    if (!S.drag) return;
    var c = byId(S.drag.id);
    if (!c) return;
    var nx = S.drag.x + (e.clientX - S.drag.ox);
    var ny = S.drag.y + (e.clientY - S.drag.oy);
    if (Math.abs(nx - S.drag.x) + Math.abs(ny - S.drag.y) > 3) S.drag.moved = true;
    c.x = Math.max(8, nx); c.y = Math.max(8, ny);
    var el = document.getElementById("dev-" + c.id);
    if (el) { el.style.left = c.x + "px"; el.style.top = c.y + "px"; }
    layoutWires();
  });
  document.addEventListener("pointerup", function () {
    if (S.drag && !S.drag.moved) { S.selected = { kind: "comp", id: S.drag.id }; draw(); }
    S.drag = null;
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Delete" && S.selected && !e.target.matches("input, textarea")) removeSelected();
  });
  document.addEventListener("dragstart", function (e) {
    var chip = e.target.closest("[data-fn]");
    if (!chip) return;
    e.dataTransfer.setData("text/fn", chip.getAttribute("data-fn"));
  });
  document.addEventListener("dragover", function (e) {
    if (e.target.closest("[data-drop]")) e.preventDefault();
  });
  document.addEventListener("drop", function (e) {
    var card = e.target.closest("[data-drop]");
    if (!card) return;
    e.preventDefault();
    var fn = e.dataTransfer.getData("text/fn");
    if (!fn) return;
    S.idState.labels[card.getAttribute("data-card")] = fn;
    persist();
    draw();
  });
  document.addEventListener("click", function (e) {
    var card = e.target.closest("[data-drop]");
    if (!card || !S.armFn) return;
    if (e.target.closest("[data-act='set-mode']")) return;
    S.idState.labels[card.getAttribute("data-card")] = S.armFn;
    persist();
    draw();
  });

  setInterval(function () {
    var el = document.getElementById("attempt-clock");
    if (el) el.textContent = fmtTime(elapsed());
  }, 500);

  function boot() {
    loadStore();
    S.sim = freshSim();
    S.world = E.createWorld();
    renderShell();
  }

  window.Lab = {
    boot: boot,
    go: go,
    state: function () { return S; },
    place: function (type, x, y) { return placePart(type, x, y); },
    wire: function (a, b, col, cable, pair) { E.addWire(S.world, a, b, col || "red", cable || "4core", pair || null); S.lastReport = null; draw(); },
    setState: function (id, st) { var c = byId(id); if (!c) return; Object.keys(st).forEach(function (k) { c.state[k] = st[k]; }); runEval(!!S.sim.powered); draw(); },
    power: function () { doPower(true); },
    isolate: function () { doPower(false); },
    mark: function () { doMark(); },
    result: function () { return S.result; },
    liveText: function () { var el = document.getElementById("live-summary"); return el ? el.textContent : ""; },
    setAnswers: function (arr) { S.answerMap[S.mission] = arr.slice(); },
    setKeypad: function (p) { Object.keys(p).forEach(function (k) { S.sim.keypadProg[k] = p[k]; }); },
    setCtrl: function (cfg) { S.sim.ctrl = cfg; },
    submitFault: submitFault,
    loadFault: loadFault,
    comm: doComm,
    setCommForm: function (f) { Object.keys(f).forEach(function (k) { S.commForm[k] = f[k]; }); },
    probe: function (mode, red, black) {
      S.tool = "meter"; S.meter.mode = mode; S.meter.red = red; S.meter.black = black;
      if (!S.lastReport) runEval(false);
      var reading = E.measure(S.world, S.sim, red, black, mode);
      S.meter.text = reading.text;
      if (mode === "V" && S.commPack) S.commPack.seen.usedMeter = true;
      draw();
      return reading.text;
    },
    draw: draw,
    runEval: runEval
  };

  boot();
})();

</script>
</body>
</html>
